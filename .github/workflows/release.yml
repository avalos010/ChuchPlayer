name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version info from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "name=$VER"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/release.keystore

      - name: Patch versionCode and versionName in build.gradle
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.code }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.ver.outputs.name }}"/' app/build.gradle

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace -PreactNativeArchitectures=${{ matrix.abi }}

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             chuchplayer-${{ steps.ver.outputs.tag }}-${{ matrix.abi }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chuchplayer-${{ matrix.abi }}
          path: chuchplayer-${{ steps.ver.outputs.tag }}-${{ matrix.abi }}.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version info from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "name=$VER"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: chuchplayer-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ChuchPlayer ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: release-assets/*.apk

      - name: Update version.json and push to main
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}"
          jq \
            --argjson code "${{ steps.ver.outputs.code }}" \
            --arg     name "${{ steps.ver.outputs.name }}" \
            --arg     tag  "${{ steps.ver.outputs.tag }}" \
            --arg     url  "$APK_URL" \
            '.versionCode = $code
             | .versionName = $name
             | .apkUrl = "\($url)/chuchplayer-\($tag)-arm64-v8a.apk"
             | .apkUrls = {
                 "arm64-v8a": "\($url)/chuchplayer-\($tag)-arm64-v8a.apk",
                 "armeabi-v7a": "\($url)/chuchplayer-\($tag)-armeabi-v7a.apk",
                 "x86": "\($url)/chuchplayer-\($tag)-x86.apk",
                 "x86_64": "\($url)/chuchplayer-\($tag)-x86_64.apk"
               }' \
            version.json > version.json.tmp && mv version.json.tmp version.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: bump version.json to ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
